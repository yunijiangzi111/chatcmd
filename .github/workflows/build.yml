# 注：GitHub Actions 只扫描仓库根目录的 .github/workflows/，
# 本文件必须待在根目录才会被执行。
name: ChatCmd Build

on:
  push:
    branches: [main]
    # 这是 ChatCmd 单模组仓库，tag 直接用简洁的 v<版本号>（如 v0.6.2）。
    # 不需要模组前缀：前缀式是给「多模组共用一仓」准备的，这里用不上。
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ChatCmd 的 Gradle 工程就在仓库根，直接构建即可。
      - name: Build with Gradle
        run: ./gradlew build

      # 只收两个平台的成品 jar：它们各自都自带了 core 的类，是自包含的，
      # core-*.jar 只是中间产物，不该发给玩家。
      #
      # 两个目录都必须是 build/libs：
      #   neoforge 的 :jar 直接输出到 build/libs；
      #   forge 走 legacyforge 插件，开发产物落在 build/devlibs，
      #   重混淆后的成品才是 build/libs 里那个。
      #
      # 必须先平铺到一个目录再上传：upload-artifact 会保留路径层级，
      # 直接写上面两个不同目录的话，artifact 里会带着 neoforge/… 与 forge/…
      # 的层级，下载回来就是 jars/neoforge/build/libs/xxx.jar，
      # 下面 release job 里的 jars/chatcmd-*.jar 一条都匹配不上，发布直接失败。
      - name: Collect jars
        run: |
          mkdir -p dist
          cp neoforge/build/libs/chatcmd-*.jar dist/
          cp forge/build/libs/chatcmd-*.jar dist/
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatcmd-jar
          path: dist/*.jar
          if-no-files-found: error

  # 推 v* 标签时自动建 Release 并把成品 jar 挂上去。
  # 平时推 main / 发 PR 只跑上面的 build，不会进这个 job。
  release:
    # 必须和上面的 tags 过滤器一致：tag 是 v0.6.2 时，
    # github.ref 是 refs/tags/v0.6.2。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: chatcmd-jar
          path: jars

      # Release 正文直接取 CHANGELOG.md 里对应版本的条目，
      # 而不是让 gh 自动生成一串提交标题 —— 玩家要看的是「更新了什么」，不是 commit 列表。
      # fork 出来的 awk 只取「双语 CHANGELOG 里的第一段」（中文那段），
      # 碰到下一个 ### 标题就停，所以英文那段不会重复贴进来。
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "### " v) == 1 { flag = 1 }
            flag && /^### / && index($0, "### " v) != 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "---- RELEASE_NOTES.md ($(wc -l < RELEASE_NOTES.md) lines) ----"
          cat RELEASE_NOTES.md

      # checkout 之后当前目录就是 git 仓库了，但这里仍显式用 --repo，
      # 免得 workflow 里 checkout 顺序一改又踩坑。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # ${GITHUB_REF_NAME#v} 去掉开头的 v，标题显示成「ChatCmd 0.7.0」而不是「ChatCmd v0.7.0」。
        # 先 ls 一下下载回来的 jar：万一 artifact 的路径层级又变了，
        # 日志里能直接看出实际结构，不用再猜（v0.7.0 第一次发布就栽在这上面）。
        run: |
          ls -l jars
          gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --title "ChatCmd ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md jars/chatcmd-*.jar