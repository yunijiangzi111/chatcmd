# 注：GitHub Actions 只扫描仓库根目录的 .github/workflows/，
# 本文件必须待在根目录才会被执行。
name: ChatCmd Build

on:
  push:
    branches: [main]
    # 这是 ChatCmd 单模组仓库，tag 直接用简洁的 v<版本号>（如 v0.6.2）。
    # 不需要模组前缀：前缀式是给「多模组共用一仓」准备的，这里用不上。
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ChatCmd 的 Gradle 工程就在仓库根，直接构建即可。
      - name: Build with Gradle
        run: ./gradlew build

      # 只上传 neoforge 的成品 jar：它已自带 core 的类，是自包含的，
      # core-*.jar 只是中间产物，不该发给玩家。
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatcmd-jar
          path: neoforge/build/libs/chatcmd-*.jar
          if-no-files-found: error

  # 推 v* 标签时自动建 Release 并把成品 jar 挂上去。
  # 平时推 main / 发 PR 只跑上面的 build，不会进这个 job。
  release:
    # 必须和上面的 tags 过滤器一致：tag 是 v0.6.2 时，
    # github.ref 是 refs/tags/v0.6.2。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: chatcmd-jar
          path: jars

      # 这个 job 没有 checkout，当前目录不是 git 仓库，
      # gh 无法自行推断目标仓库，必须用 --repo 显式指定。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # ${GITHUB_REF_NAME#v} 去掉开头的 v，标题显示成「ChatCmd 0.6.2」而不是「ChatCmd v0.6.2」。
        run: gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --title "ChatCmd ${GITHUB_REF_NAME#v}" --generate-notes jars/chatcmd-*.jar