# 注意：GitHub Actions 只会扫描仓库根目录的 .github/workflows/，
# 放在 chatcmd/.github/ 下是不会被执行的，所以这个文件必须待在根目录。
name: ChatCmd Build

on:
  push:
    branches: [main]
    # tag 用「模组id-v版本」前缀式（如 chatcmd-v0.6.2）：
    # 本仓库将来会有多个模组，而 Releases 是仓库级的单一列表，
    # 不带前缀的话两个模组都发 v0.1.0 就分不清是谁的了。
    tags: ['chatcmd-v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ChatCmd 是仓库子目录里的独立 Gradle 工程，checkout 落在仓库根，
      # 必须切进 chatcmd/ 再构建。
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: chatcmd

      # 只上传 neoforge 的成品 jar：它已自带 core 的类，是自包含的，
      # core-*.jar 只是中间产物，不该发给玩家。
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatcmd-jar
          path: chatcmd/neoforge/build/libs/chatcmd-*.jar
          if-no-files-found: error

  # 推 v* 标签时自动建 Release 并把成品 jar 挂上去。
  # 平时推 main / 发 PR 只跑上面的 build，不会进这个 job。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: chatcmd-jar
          path: jars

      # 这个 job 没有 checkout，当前目录不是 git 仓库，
      # gh 无法自行推断目标仓库，必须用 --repo 显式指定。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # ${GITHUB_REF_NAME#chatcmd-v} 去掉 tag 前缀，标题显示成「ChatCmd 0.6.2」而不是「ChatCmd chatcmd-v0.6.2」。
        run: gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --title "ChatCmd ${GITHUB_REF_NAME#chatcmd-v}" --generate-notes jars/chatcmd-*.jar
