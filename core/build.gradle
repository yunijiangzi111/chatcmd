// :core —— 纯 Java 解析引擎，零 Minecraft 依赖。
// 这个模块只依赖 JUnit，可以脱离游戏直接跑测试。

plugins {
    id 'java-library'
}

// 定在 Java 17：Forge 1.20.1 跑在 Java 17 上，字节码 17 在 Java 21 下照样运行，
// 所以一份 core 能同时喂给 :neoforge（Java 21）和 :forge（Java 17）。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 零依赖硬约束（计划 §3.3）：core 内禁止出现任何 Minecraft / NeoForge 引用。
// 靠自觉必然腐化，所以用任务在 build 时强制扫描，命中即失败。
tasks.register('checkCorePurity') {
    group = 'verification'
    description = '扫描 core 源码，禁止出现 net.minecraft.* / net.neoforged.* / net.minecraftforge.* 引用'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    doLast {
        // 两个平台都要防：neoforge 子模块会引入 net.neoforged.*，
        // forge 子模块会引入 net.minecraftforge.*（注意它不含 'net.minecraft.' 这个子串，
        // 因为后者带尾点，必须单独列一条）。
        def forbidden = ['net.minecraft.', 'net.neoforged.', 'net.minecraftforge.']
        def bad = []
        if (srcDir.exists()) {
            srcDir.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    f.eachLine { line, no ->
                        if (forbidden.any { line.contains(it) }) {
                            bad << "${f.name}:${no}  ${line.trim()}"
                        }
                    }
                }
            }
        }
        if (!bad.isEmpty()) {
            throw new GradleException("core 违反零依赖约束，发现 Minecraft / NeoForge / Forge 引用：\n" + bad.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'checkCorePurity'
}
