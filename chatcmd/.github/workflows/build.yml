name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本模组位于仓库子目录 chatcmd/，且是独立的 Gradle 工程，
      # checkout 落在仓库根，必须切进 chatcmd/ 再构建。
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: chatcmd

      # 只上传 neoforge 的成品 jar：它已自带 core 的类，是自包含的，
      # core-*.jar 只是中间产物，不该发给玩家。
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatcmd-jar
          path: chatcmd/neoforge/build/libs/chatcmd-*.jar
          if-no-files-found: error

  # 推 v* 标签时自动建 Release 并把成品 jar 挂上去。
  # 平时推 main / 发 PR 只跑上面的 build，不会进这个 job。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: chatcmd-jar
          path: jars

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "ChatCmd ${GITHUB_REF_NAME}" --generate-notes jars/chatcmd-*.jar
