# 构建用的 JDK 路径不写在本文件，而是写在「用户级」配置里：
#   C:\Users\xiaoh\.gradle\gradle.properties  ->  org.gradle.java.home=C:/Users/xiaoh/.local/lib/jdk-21
# 好处：以后在 mc-mods/ 下新增其它模组时，不用每个工程重复填一遍 JDK 路径。

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# 本机 ANSI 代码页是 GBK，而 JDK 21 起的 Gradle 守护进程默认按 UTF-8 写 JVM 的 @argfile，
# JVM 却按系统原生编码（GBK）去读它 —— 两边不一致会让中文路径的 classpath 全部失效，
# 症状是测试和 runClient 报 ClassNotFoundException。
# 把守护进程也设成 GBK，写入/读取编码就对齐了。实测：UTF-8 的 argfile 必失败，GBK 的必成功。
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=GBK
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 关掉配置缓存：ModDevGradle 的 createMinecraftArtifacts 任务无法被序列化，
# 开着会直接报 "Configuration cache state could not be cached" 让构建失败。
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
# 定在 21.1.228：与目标整合包「重度机械症 1.1.10」的 NeoForge 版本一致，
# 这样 neoforge.mods.toml 里的依赖范围会生成 [21.1.228,)，整合包能满足。
neo_version=21.1.228
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties（模组属性）

# 模组的唯一标识符。必须全小写，须匹配正则 [a-z][a-z0-9_]{1,63}
# 必须与 @Mod 注解所在主类里的字符串常量一致。
mod_id=chatcmd
# 模组的显示名称。
# 中文必须写成 \uXXXX 转义（聊天指令 = \u804A\u5929\u6307\u4EE4）。
# 原因：Gradle 守护进程以 -Dfile.encoding=GBK 运行，会按 GBK 解码本文件，
# 直接写中文会变成乱码，进而污染 jar 里 neoforge.mods.toml 的 displayName。
mod_name=ChatCmd \u804A\u5929\u6307\u4EE4
# 模组许可证。可选值见 https://choosealicense.com/
mod_license=MIT
# 模组版本号。语义化版本见 https://semver.org/
mod_version=0.6.2
# 模组的 group ID，仅在发布到 Maven 仓库时重要。
# 应与模组源码的基础包名一致。
# 命名约定见 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.xiaoh.chatcmd
